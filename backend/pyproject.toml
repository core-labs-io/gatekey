[project]
name = "gatekey-backend"
version = "0.1.0"
description = "Gatekey gateway backend (FastAPI). Phase 1.1 slice: Provider & Key Management."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "httpx>=0.27,<1.0",
    "cryptography>=42.0,<44.0",
    # Phase 2 (BD-3): OIDC ID-token validation (RS*/ES*/PS* via JWKS) and
    # the HS256-signed login-state cookie - see services/oidc.py.
    "PyJWT[crypto]>=2.8,<3.0",
    "google-auth>=2.30,<3.0",
    # google.auth.transport.requests (used to refresh Vertex AI service
    # account credentials) requires `requests` even though the rest of the
    # codebase uses httpx for outbound HTTP calls.
    "requests>=2.31,<3.0",
    # Phase 3 (BD-1): in-process PII/DLP scanning - see services/dlp.py and
    # design doc section 10 fork #2 (pattern-recognizer-only registry, small
    # spaCy model, to hit the <50ms p99 NFR). `en_core_web_sm` is pinned as a
    # direct-wheel URL (the standard way to install a spaCy model as a
    # regular pip dependency - spaCy models are not PyPI packages) at the
    # version matching the `spacy` pin below.
    "presidio-analyzer>=2.2,<3.0",
    "presidio-anonymizer>=2.2,<3.0",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Phase 3 (BD-12): `zoneinfo` (stdlib) needs an IANA tz database backing
    # it - present via the OS on Linux/macOS, but Windows ships none, and
    # some minimal container base images omit it too. `tzdata` is the
    # official CPython-recommended PyPI package for exactly this gap (see
    # https://docs.python.org/3/library/zoneinfo.html#data-sources) - not a
    # new *concept* (still stdlib `zoneinfo`, design doc section 5.2), just
    # the portable data source for it. Safe/inert to install on platforms
    # that already have system tz data.
    "tzdata>=2024.1",
    # Phase 4 (BD-2): optional Redis-backed `SharedStateStore` - see
    # services/shared_state.py and design doc section 4.1/9.3. Always
    # installed (same "always-present, config-gated at runtime" posture as
    # PyJWT for optional OIDC) but never connected-to unless
    # GATEKEY_REDIS_URL is set; redis-py ships native asyncio support
    # (`redis.asyncio`) since 4.2, no separate aioredis package needed.
    "redis>=5.0,<6.0",
    # Tier 4 (ops polish): /metrics endpoint - the standard Prometheus
    # client, counters/histograms recorded by the observability middleware.
    "prometheus-client>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff==0.15.21",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gatekey"]

# Required by hatchling to accept the `en_core_web_sm @ https://...` direct
# wheel-URL dependency above (pyproject.toml, BD-1) - spaCy models are not
# PyPI packages, so a direct URL is the standard way to pin one as an
# installable dependency.
[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# `sf` (a session-factory fixture defined in tests/integration/phase2_helpers.py,
# not conftest.py) must be imported into each test file that uses it - pytest
# only discovers a non-conftest fixture in files that import the decorated
# function into their own module namespace. Every test function that then
# takes `sf` as a parameter is consuming that imported fixture by design (the
# normal pytest pattern), not accidentally shadowing it - ruff's F811 doesn't
# know about pytest's fixture-injection semantics and flags every one of
# those parameters as a "redefinition" of the import. Removing the import
# breaks fixture discovery (`fixture 'sf' not found`) - verified by actually
# doing it and running the suite, not assumed. Scoped to exactly the files
# that import `sf` from phase2_helpers, not the whole test suite, so a real
# F811 elsewhere still gets caught.
"tests/integration/test_access_schedule_gateway.py" = ["F811"]
"tests/integration/test_custom_model_end_user_visibility_gap.py" = ["F811"]
"tests/integration/test_custom_models_api.py" = ["F811"]
"tests/integration/test_member_model_restrictions_api.py" = ["F811"]
"tests/integration/test_org_budget_safeguard.py" = ["F811"]
"tests/integration/test_phase2_budget_concurrency.py" = ["F811"]
"tests/integration/test_phase2_governance_api.py" = ["F811"]
"tests/integration/test_phase4_team_rbac.py" = ["F811"]
"tests/integration/test_scim_e2e.py" = ["F811"]
"tests/integration/test_shadow_ai_e2e.py" = ["F811"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
